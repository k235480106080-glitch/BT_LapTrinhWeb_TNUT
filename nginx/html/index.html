<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Web & Backend Node-RED</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; color: #28a745; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Xin chào các bạn!</h1>
        <p>Hệ thống chạy trên WSL Ubuntu + Docker Compose</p>
        <button onclick="callApi()">Gọi API Node-RED</button>
        <div id="result">Đang chờ bấm nút...</div>
    </div>

    <script>
        function callApi() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML = 
                        `Phản hồi: <b>${data.message}</b><br>Thời gian: ${data.time}`;
                })
                .catch(error => {
                    document.getElementById('result').innerText = "Lỗi kết nối API!";
                });
        }
    </script>
</body>
</html>
